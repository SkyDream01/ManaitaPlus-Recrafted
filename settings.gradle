pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
            content {
                includeGroup 'net.neoforged'
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'manaita_plus_general'

// The 26.3 port targets NeoForge. Shared sources are bundled into its jar.
include 'common'
include 'neoforge'
