plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

evaluationDependsOn(':common') // Because of the sourceset reference below

neoForge {
    version = project.neoforge_version

    // Validate AT files and raise errors when they have invalid targets
    validateAccessTransformers = false

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        dataServer {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
            // Shared code lives in the common module; its classes must be part of the
            // mod composite so they load in the game layer alongside the mod classes.
            sourceSet project(':common').sourceSets.main
        }
    }
}

configurations {
    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation project(path: ':common')

    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-common-api:$rootProject.jei_version"
    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-neoforge-api:$rootProject.jei_version"
    // The JEI mixins target internal implementation classes, which are not included in the API artifacts.
    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-neoforge:$rootProject.jei_version"
    runtimeOnly "mezz.jei:jei-$rootProject.minecraft_version-neoforge:$rootProject.jei_version"

    compileOnly "top.theillusivec4.curios:curios-neoforge:$rootProject.curios_version+$rootProject.minecraft_version:api"
    // NOTE: the full curios jar is intentionally NOT a runtime dependency here:
    // curios 17.0.0-beta.2+26.3 references ModConfig.Type.COMMON which FML 12
    // (NeoForge 26.3.0.48-beta) renamed to LOCAL, so it crashes on construct.
    // Rings register only when a compatible curios is installed at runtime.
}

// Bundle the shared common module classes and resources into the platform jar.
tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar', Jar).configure {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Ship the license scope and GPL text with both binary and source releases.
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('LICENSING.md')) { into 'META-INF' }
    from(rootProject.file('LICENSES/GPL-3.0-only.txt')) { into 'META-INF/LICENSES' }
}

processResources {
    def props = [
        minecraft_version       : rootProject.minecraft_version,
        minecraft_version_range : '[26.3,26.4)',
        neo_version             : rootProject.neoforge_version,
        neo_version_range       : '[26.3.0,26.4)',
        loader_version_range    : '[1,)',
        mod_id                  : rootProject.mod_id,
        mod_name                : rootProject.mod_name,
        mod_license             : rootProject.mod_license,
        mod_version             : rootProject.mod_version,
        mod_authors             : rootProject.mod_authors,
        mod_description         : rootProject.mod_description,
        displayURL              : rootProject.display_url
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
