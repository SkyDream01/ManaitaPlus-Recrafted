plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

// The common module compiles against unmodified Minecraft (NeoForm) so its
// sources stay loader-independent.
neoForge {
    neoFormVersion = project.neoform_version
}

dependencies {
    // Shared JEI recipe model/category; loader modules provide the runtime implementation.
    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-common-api:$rootProject.jei_version"
}

tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
